[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-connect"
version = "0.1.0"
description = "Connect to DaVinci Resolve 21 via its scripting API: CLI and MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8"]

[project.scripts]
resolve-connect = "resolve_connect.cli:main"
resolve-connect-mcp = "resolve_connect.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
